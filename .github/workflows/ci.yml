name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: alcor
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: alcor_payroll_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alcor -d alcor_payroll_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: alcor_payroll_test
      DB_USERNAME: alcor
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql
          coverage: none

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Code style
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests
        run: vendor/bin/phpunit

      - name: Assignment scenario
        run: php artisan migrate:fresh --force && php artisan payroll:demo
